<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Fruit Shop - Fresh Fruits Online</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header role="banner">
      <div class="header-center">
        <a href="index.html" class="logo" aria-label="Go to homepage">
          <img
            src="img/fruit-shop-logo.png"
            class="logo-img"
            alt="Fruit Shop Logo"
          />
          <span class="products-text"> View Products </span>
        </a>
        <nav role="navigation" aria-label="Main navigation">
          <a
            href="basket.html"
            class="basket-link"
            aria-label="View shopping basket"
          >
            <img
              src="img/basket-icon.png"
              class="basket-img"
              alt="Shopping basket icon"
            />
            <span class="basket-text">View shopping basket</span>
          </a>
        </nav>
      </div>
    </header>
    <main id="main-content" role="main">
      <h1 class="products-title">Products</h1>
      
      <!-- Category Tabs -->
      <div class="category-tabs" role="tablist" aria-label="Product categories">
        <button class="tab-button active" role="tab" aria-selected="true" aria-controls="fruits-panel" data-category="fruits">
          🍎 Fruits
        </button>
        <button class="tab-button" role="tab" aria-selected="false" aria-controls="vegetables-panel" data-category="vegetables">
          🥬 Vegetables
        </button>
      </div>
      
      <!-- Fruits Category -->
      <ul class="emoji-list" id="fruits-panel" role="tabpanel" aria-labelledby="fruits-tab" data-category="fruits">
      </ul>
      
      <!-- Vegetables Category -->
      <ul class="emoji-list" id="vegetables-panel" role="tabpanel" aria-labelledby="vegetables-tab" data-category="vegetables" style="display: none;">
      </ul>
    </main>
    <footer>
      <a
        href="https://www.linkedin.com/in/timlolkema/"
        target="_blank"
        rel="noopener noreferrer"
      >
        By Tim Lolkema
      </a>
    </footer>
    <script src="shop.js"></script>
    <script>
      // Render products for each category
      function renderProductsByCategory() {
        const categories = ['fruits', 'vegetables'];
        categories.forEach(category => {
          const panel = document.querySelector(`.emoji-list[data-category="${category}"]`);
          if (!panel) return;
          
          panel.innerHTML = '';
          Object.entries(PRODUCTS).forEach(([id, product]) => {
            if (product.categories && product.categories.includes(category)) {
              const li = document.createElement('li');
              li.innerHTML = `
                <a href="product-${id}.html" class="emoji-box" aria-label="View ${product.name} product details">
                  ${product.emoji}
                </a>
                <a href="product-${id}.html">Go to ${product.name}</a>
              `;
              panel.appendChild(li);
            }
          });
        });
      }
      
      // Tab switching functionality
      function setupTabs() {
        const tabButtons = document.querySelectorAll('.tab-button');
        tabButtons.forEach(button => {
          button.addEventListener('click', function() {
            const category = this.getAttribute('data-category');
            
            // Update button states
            tabButtons.forEach(btn => {
              btn.classList.remove('active');
              btn.setAttribute('aria-selected', 'false');
            });
            this.classList.add('active');
            this.setAttribute('aria-selected', 'true');
            
            // Update panel visibility
            document.querySelectorAll('[role="tabpanel"]').forEach(panel => {
              panel.style.display = 'none';
            });
            document.querySelector(`.emoji-list[data-category="${category}"]`).style.display = '';
          });
        });
      }
      
      // Initialize on page load
      document.addEventListener('DOMContentLoaded', function() {
        renderProductsByCategory();
        setupTabs();
      });
    </script>
  </body>
</html>
